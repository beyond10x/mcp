[workspace]
members = [
    "crates/b10x-mcp-types",
    "crates/b10x-mcp-client",
    "crates/b10x-mcp-http",
    "crates/b10x-mcp-stdio",
    "crates/b10x-mcp-oauth",
    "crates/b10x-mcp-config",
    "crates/b10x-mcp-command",
    "crates/b10x-mcp-cli",
    "crates/b10x-mcp-testkit",
    "crates/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/mcp"

[workspace.dependencies]
b10x-mcp-types = { version = "0.1.1", path = "crates/b10x-mcp-types" }
b10x-mcp-client = { version = "0.1.1", path = "crates/b10x-mcp-client" }
b10x-mcp-http = { version = "0.1.1", path = "crates/b10x-mcp-http" }
b10x-mcp-stdio = { version = "0.1.1", path = "crates/b10x-mcp-stdio" }
b10x-mcp-oauth = { version = "0.1.1", path = "crates/b10x-mcp-oauth" }
b10x-mcp-config = { version = "0.1.1", path = "crates/b10x-mcp-config" }
b10x-mcp-command = { version = "0.1.1", path = "crates/b10x-mcp-command" }
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
http = "1"
oauth2 = "5.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "=3.2.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
url = "2.4"
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
